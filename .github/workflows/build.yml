name: Build and commit dist

on:
  push:
    branches: [react-17-compatible]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: yarn install

      - name: Build graphic-walker
        run: yarn workspace @kanaries/graphic-walker build

      - name: Commit dist folder
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/graphic-walker/dist -f
          git diff --staged --quiet || git commit -m "chore: build dist folder [skip ci]"
          git push
